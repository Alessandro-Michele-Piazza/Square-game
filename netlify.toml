[build]
  # Comando per costruire il progetto
  command = "npm run build"
  
  # Directory con i file compilati
  publish = "dist"

# Configurazione per Single Page Application (React Router)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache immutabile per asset Vite con hash nel nome (JS/CSS chunks)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache lunga per immagini e font statici in /media
[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Nessuna cache per index.html (entry point SPA)
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
